name: Build NEEDZO Android APK

on:
  workflow_dispatch:
    push:
        branches:
              - main

              jobs:
                build-apk:
                    runs-on: ubuntu-latest
                        steps:
                              - name: Checkout repository
                                      uses: actions/checkout@v4

                                            - name: Setup Node.js
                                                    uses: actions/setup-node@v4
                                                            with:
                                                                      node-version: '22'

                                                                            - name: Setup Java 21
                                                                                    uses: actions/setup-java@v4
                                                                                            with:
                                                                                                      distribution: 'temurin'
                                                                                                                java-version: '21'

                                                                                                                      - name: Setup Android SDK & Capacitor APK Project
                                                                                                                              run: |
                                                                                                                                        mkdir -p dist
                                                                                                                                                  echo "<!doctype html><html><body>Loading NEEDZO...</body></html>" > dist/index.html
                                                                                                                                                            npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
                                                                                                                                                                      node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({ appId: 'com.eevanventures.needzo', appName: 'NEEDZO', webDir: 'dist', server: { url: 'https://needzo-bhopal.eevanventures.workers.dev', cleartext: false } }, null, 2))"
                                                                                                                                                                                npx cap add android
                                                                                                                                                                                          npx cap sync android

                                                                                                                                                                                                - name: Build Debug APK
                                                                                                                                                                                                        working-directory: android
                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                          chmod +x gradlew
                                                                                                                                                                                                                                    ./gradlew assembleDebug

                                                                                                                                                                                                                                          - name: Upload NEEDZO APK
                                                                                                                                                                                                                                                  uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                          with:
                                                                                                                                                                                                                                                                    name: NEEDZO-Android-APK
                                                                                                                                                                                                                                                                              path: android/app/build/outputs/apk/debug/app-debug.apk
