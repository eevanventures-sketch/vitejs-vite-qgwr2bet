name: Build NEEDZO Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build Debug APK with NEEDZO Icon
        run: |
          mkdir -p dist assets
          echo "<!doctype html><html><body>Loading NEEDZO...</body></html>" > dist/index.html
          cat << 'EOF' > assets/logo.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
            <path d="M512 235 L775 455 L720 455 L720 760 L304 760 L304 455 L249 455 Z" fill="#14B8A6" stroke="#14B8A6" stroke-width="28" stroke-linejoin="round"/>
            <rect x="386" y="455" width="58" height="240" rx="14" fill="#FFFFFF"/>
            <rect x="580" y="455" width="58" height="240" rx="14" fill="#FFFFFF"/>
            <line x1="415" y1="482" x2="609" y2="668" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round"/>
            <path d="M690 235 L704 271 L740 285 L704 299 L690 335 L676 299 L640 285 L676 271 Z" fill="#FBBF24"/>
          </svg>
          EOF
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3.0.5
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({ appId: 'com.eevanventures.needzo', appName: 'NEEDZO', webDir: 'dist', server: { url: 'https://needzo-bhopal.eevanventures.workers.dev', cleartext: false } }, null, 2))"
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0F172A' --splashBackgroundColor '#0F172A'
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NEEDZO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
