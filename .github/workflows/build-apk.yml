name: Build NEEDZO Android APK
on: [push, workflow_dispatch]
jobs:
  build-apk:
      runs-on: ubuntu-latest
          steps:
                - uses: actions/checkout@v4
                      - uses: actions/setup-node@v4
                              with:
                                        node-version: '22'
                                              - uses: actions/setup-java@v4
                                                      with:
                                                                distribution: 'temurin'
                                                                          java-version: '21'
                                                                                - uses: android-actions/setup-android@v3
                                                                                      - name: Build Debug APK
                                                                                              run: |
                                                                                                        mkdir -p dist
                                                                                                                  echo "<!doctype html><html><body>Loading NEEDZO...</body></html>" > dist/index.html
                                                                                                                            npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
                                                                                                                                      node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({ appId: 'com.eevanventures.needzo', appName: 'NEEDZO', webDir: 'dist', server: { url: 'https://needzo-bhopal.eevanventures.workers.dev', cleartext: false } }, null, 2))"
                                                                                                                                                npx cap add android
                                                                                                                                                          npx cap sync android
                                                                                                                                                                    cd android
                                                                                                                                                                              chmod +x gradlew
                                                                                                                                                                                        ./gradlew assembleDebug
                                                                                                                                                                                              - uses: actions/upload-artifact@v4
                                                                                                                                                                                                      with:
                                                                                                                                                                                                                name: NEEDZO-Android-APK
                                                                                                                                                                                                                          path: android/app/build/outputs/apk/debug/app-debug.apk
