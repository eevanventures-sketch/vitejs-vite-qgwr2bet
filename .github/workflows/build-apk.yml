name: Build NEEDZO Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Prepare Keystore and Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p dist assets "$HOME/.android"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > "$HOME/.android/debug.keystore"
          else
            rm -f "$HOME/.android/debug.keystore"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NEEDZO,O=EevanVentures,C=IN"
          fi
          echo "<!doctype html><html><body>Loading NEEDZO...</body></html>" > dist/index.html
          cat << 'EOF' > assets/logo.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
            <path d="M512 235 L775 455 L720 455 L720 760 L304 760 L304 455 L249 455 Z" fill="#14B8A6" stroke="#14B8A6" stroke-width="28" stroke-linejoin="round"/>
            <rect x="386" y="455" width="58" height="240" rx="14" fill="#FFFFFF"/>
            <rect x="580" y="455" width="58" height="240" rx="14" fill="#FFFFFF"/>
            <line x1="415" y1="482" x2="609" y2="668" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round"/>
            <path d="M690 235 L704 271 L740 285 L704 299 L690 335 L676 299 L640 285 L676 271 Z" fill="#FBBF24"/>
          </svg>
          EOF
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3.0.5 @capacitor-firebase/authentication@7
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({ appId: 'com.eevanventures.needzo', appName: 'NEEDZO', webDir: 'dist', server: { url: 'https://needzo-bhopal.eevanventures.workers.dev', cleartext: false }, plugins: { FirebaseAuthentication: { skipNativeAuth: true, providers: ['google.com'] } } }, null, 2))"
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0F172A' --splashBackgroundColor '#0F172A'
          if [ -n "$GOOGLE_SERVICES" ]; then
            node -e "require('fs').writeFileSync('android/app/google-services.json', process.env.GOOGLE_SERVICES)"
            node -e "const fs=require('fs'),p='android/variables.gradle';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('ext {','ext {'+String.fromCharCode(10)+'    rgcfaIncludeGoogle = true'))"
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          APK_SHA=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA1:" | head -n 1)
          echo "### APK Diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "Actual APK $APK_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$GOOGLE_SERVICES" ]; then
            node -e "const g=JSON.parse(process.env.GOOGLE_SERVICES);const c=g.client&&g.client[0];const pkg=c?.client_info?.android_client_info?.package_name;const o1=(c?.oauth_client||[]).find(x=>x.client_type===1);const o3=(c?.oauth_client||[]).find(x=>x.client_type===3);require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\nJSON Package: '+pkg+'\nJSON Hash: '+(o1?.certificate_hash||'none')+'\nJSON Web Client: '+(o3?.client_id||'none')+'\n')"
          fi
          STR_XML="android/app/build/generated/res/google-services/debug/values/values.xml"
          if [ -f "$STR_XML" ]; then
            grep "default_web_client_id" "$STR_XML" >> "$GITHUB_STEP_SUMMARY" || echo "NO_DEFAULT_WEB_CLIENT_ID" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "MISSING_VALUES_XML" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NEEDZO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
